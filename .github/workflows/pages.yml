name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The repo's quality gate is npm run verify (typecheck + test + build).
  # Pages deploys straight from main, so this gate runs in CI and blocks the
  # deploy — the bundle-freshness guard below only catches staleness, not
  # broken source.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The bundle is committed (dist/), so Pages keeps its zero-toolchain
      # upload of path "."; this guard fails the deploy when the committed
      # bundle no longer matches src/. node_modules is removed before the
      # artifact upload, which would otherwise publish it.
      - name: Verify committed bundle is fresh
        run: |
          npm ci
          npm run build
          if ! git diff --quiet -- dist/ || [ -n "$(git ls-files --others --exclude-standard -- dist/)" ]; then
            echo '::error::dist/ is stale — run npm run build and commit the result.'
            git diff --stat -- dist/
            exit 1
          fi
          rm -rf node_modules
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
